[project]
name = "rhcsa-practice-labs"
version = "1.0.0"
description = "SadServers-style practice environment for RHCSA exam preparation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "mdgjohnny"}
]
keywords = ["rhcsa", "linux", "sysadmin", "practice", "exam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "Flask>=3.0.0",
    "Flask-SocketIO>=5.3.0",
    "Flask-Limiter>=3.5.0",
    "python-socketio>=5.10.0",
    "python-engineio>=4.8.0",
    "simple-websocket>=1.0.0",
    "paramiko>=3.4.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "cryptography>=41.0.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
cloud = [
    "oci>=2.100.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-requests",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/mdgjohnny/rhcsa-practice-labs"
Repository = "https://github.com/mdgjohnny/rhcsa-practice-labs.git"
Issues = "https://github.com/mdgjohnny/rhcsa-practice-labs/issues"

[project.scripts]
rhcsa-labs = "api.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "checks*"]

[tool.setuptools.package-data]
"*" = ["*.sh", "*.json", "*.html", "*.css", "*.js", "*.svg"]

# Ruff linter configuration
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

# Mypy type checker configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests", "api/grader"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["api"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
